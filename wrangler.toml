name = "github-release-rss-collector"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[observability]
enabled = true

[[kv_namespaces]]
binding = "RELEASES"
id = "your-kv-namespace-id"
# For local dev, create a .dev.vars file with:
# KV_NAMESPACE=your-local-kv-namespace-id

[triggers]
crons = ["0 * * * *"]